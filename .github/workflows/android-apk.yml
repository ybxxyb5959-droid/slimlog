# 갤럭시 APK 자동 빌드 — main 에 화면·앱 코드가 올라오면 GitHub 이 APK 를 만들어 둔다
# 받는 곳: GitHub → Actions → 'Android APK' → 맨 위 실행 → 아래 Artifacts 의 SlimLog-apk-번호
# 필요한 Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'patches/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 앱에 들어가는 공개 값 (anon 키는 원래 공개용. service_role 키는 절대 여기 넣지 않음)
      # 저장소 Variables 에 같은 이름이 있으면 그 값을 쓴다
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://meuzopguteqnfvbgfpvy.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ldXpvcGd1dGVxbmZ2YmdmcHZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3MDU5MDgsImV4cCI6MjEwOTI4MTkwOH0.RTR8HXuw34_loZMmxRdXSCnvM-zn7OA73bXRRq4eOIY' }}
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://slimlog-api.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 설치
        run: npm ci

      - name: 화면 빌드 + 안드로이드 프로젝트에 복사
        run: |
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: 서명 키 준비
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::GitHub Secrets 에 ANDROID_KEYSTORE_BASE64 가 없어요 (docs/안드로이드_빌드_가이드.md 참고)"
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: APK 만들기
        working-directory: android
        env:
          SLIMLOG_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SLIMLOG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SLIMLOG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SLIMLOG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SLIMLOG_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 서명 확인 + 이름 붙이기
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          mkdir -p out && cp "$APK" "out/SlimLog-1.0.${{ github.run_number }}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: SlimLog-apk-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30
