# 갤럭시 테스트용 APK 자동 빌드 (PC 에 Android Studio 없이)
# - 코드를 올리면 GitHub 가 APK 를 만들고, Actions → 해당 실행 → Artifacts 에서 받는다
# - 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#     VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (anon 키는 원래 앱에 들어가는 공개 키)
#     (선택) VITE_API_URL — FastAPI 배포 후
#   ⚠ service_role 키는 절대 여기 넣지 않는다
# - Secrets 가 없으면 목업 모드 APK 가 만들어진다 (이름에 MOCK 표시, 실제 테스트용 아님)
name: Android APK

on:
  push:
    branches: [ccr-85d16b44-69xvwh, claude/confident-albattani-boohj6]
    paths-ignore: ['docs/**', '**/*.md', 'server/**', 'ai/**', 'scripts/**']
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 은 JDK 21 필요
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 의존성 설치 (지문 플러그인 보안 패치 포함)
        run: npm ci

      - name: Supabase 설정 확인
        id: mode
        env:
          HAS_URL: ${{ secrets.VITE_SUPABASE_URL != '' }}
          HAS_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY != '' }}
        run: |
          if [ "$HAS_URL" = "true" ] && [ "$HAS_KEY" = "true" ]; then
            echo "name=slimlog-debug" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY Secrets 가 없어 목업 모드로 빌드합니다 (실제 로그인·저장 안 됨)"
            echo "name=slimlog-debug-MOCK-not-for-test" >> "$GITHUB_OUTPUT"
          fi

      - name: 웹 화면 빌드
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: 안드로이드 프로젝트에 복사
        run: npx cap sync android

      - name: APK 빌드 (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mode.outputs.name }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
