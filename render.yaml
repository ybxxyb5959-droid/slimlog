# Render 배포 설정 (Blueprint) — SlimLog API (FastAPI) 하나만
# Render 대시보드 → New → Blueprint → 이 저장소 선택하면 아래대로 만들어진다.
# sync: false 인 값(비밀 키)은 저장소에 적지 않고, 만들 때 Render 화면에서 직접 넣는다.
services:
  - type: web
    name: slimlog-api
    runtime: docker
    plan: free
    region: singapore          # 한국에서 가장 가까운 지역
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    buildFilter:
      paths:
        - server/**              # 화면(src) 고칠 때는 서버를 다시 배포하지 않음
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ── Supabase (Project Settings → API) ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY   # 절대 앱·채팅에 넣지 말 것
        sync: false
      - key: SUPABASE_JWT_SECRET         # 구형(HS256) 프로젝트만 필요. 신형이면 비워 둬도 됨
        sync: false
      # ── 앱 주소 허용 (Capacitor 안드로이드 앱 = https://localhost, 개발 = http://localhost:5173) ──
      - key: ALLOWED_ORIGINS
        value: https://localhost,http://localhost:5173
      # ── 식단 사진 AI (docs/AI_Gemini_전환계획.md 0장: 식단 사진의 음식 이름·추정 인분만) ──
      - key: GEMINI_API_KEY              # Google AI Studio 의 SlimLog 프로젝트 키
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_PROVIDER
        value: gemini
      - key: AI_DAILY_LIMIT_PER_USER
        value: "10"
      - key: AI_GLOBAL_DAILY_LIMIT
        value: "300"
